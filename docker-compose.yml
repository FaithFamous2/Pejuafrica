services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pejuafrica-postgres
    environment:
      POSTGRES_USER: peju
      POSTGRES_PASSWORD: peju_dev_password
      POSTGRES_DB: pejuafrica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peju -d pejuafrica"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pejuafrica-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
